name: Publicar site

on:
  push:
    branches:
      - main
    paths:
      - "app_flutter/enem_offline_client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter/enem_offline_client
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Validar código
        run: |
          flutter analyze
          flutter test

      - name: Gerar site
        run: >-
          flutter build web --release
          --base-href "${{ steps.pages.outputs.base_path }}/"
          --dart-define=ENEM_MANIFEST_URL=

      - name: Desabilitar processamento Jekyll
        run: touch build/web/.nojekyll

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app_flutter/enem_offline_client/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
